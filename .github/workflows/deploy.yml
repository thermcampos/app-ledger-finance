name: Deploy to prod

concurrency:
  group: deploy-production
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Backend CD", "Frontend CD" ]
    types: [ completed ]

jobs:
  terraform-plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      backend_tag: ${{ steps.resolve-tags.outputs.backend_tag }}
      frontend_tag: ${{ steps.resolve-tags.outputs.frontend_tag }}
      release_tag: ${{ steps.release-tag.outputs.tag }}
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Setup Kubeconfig
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AT_SECRETS }}
        run: |
          mkdir -p ~/.kube
          doppler run --config prd -- bash -c 'echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config'
          chmod 600 ~/.kube/config

      - name: Validate cluster access
        run: |
          kubectl cluster-info
          kubectl get namespace ledger-finance

      - name: Resolve latest image tags
        id: resolve-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: thermcampos
        run: |
          BACKEND_TAG=$(bash .github/scripts/get-latest-tag.sh ledger-finance/backend)
          FRONTEND_TAG=$(bash .github/scripts/get-latest-tag.sh ledger-finance/frontend)
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"

      # Decided before the apply so the frontend pod serves it at /version.json; the release job
      # then creates the GitHub Release under this same tag.
      - name: Decide release tag
        id: release-tag
        env:
          # workflow_run: the commit CD built, not whatever main points at now.
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TAG=$(bash .github/scripts/release-tag.sh "$RELEASE_SHA")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Terraform Fmt -check -diff
        working-directory: terraform
        run: terraform fmt -check -diff

      - name: Terraform Init
        working-directory: terraform
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AT_SECRETS }}
        run: doppler run --config prd -- terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        id: check-changes
        working-directory: terraform
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AT_SECRETS }}
          BACKEND_IMAGE: ghcr.io/thermcampos/ledger-finance/backend:${{ steps.resolve-tags.outputs.backend_tag }}
          FRONTEND_IMAGE: ghcr.io/thermcampos/ledger-finance/frontend:${{ steps.resolve-tags.outputs.frontend_tag }}
          RELEASE_VERSION: ${{ steps.release-tag.outputs.tag }}
        run: |
          doppler run --config prd -- bash -c '
            TF_VAR_db_user="$TF_VAR_DB_USER" \
            TF_VAR_db_password="$TF_VAR_DB_PASSWORD" \
            TF_VAR_db_name="$TF_VAR_DB_NAME" \
            TF_VAR_r2_access_key="$AWS_ACCESS_KEY_ID" \
            TF_VAR_r2_secret_key="$AWS_SECRET_ACCESS_KEY" \
            TF_VAR_jwt_private_key="$JWT_PRIVATE_KEY" \
            TF_VAR_jwt_public_key="$JWT_PUBLIC_KEY" \
            TF_VAR_resend_api_key="$RESEND_API_KEY" \
            TF_VAR_digest_trigger_secret="$DIGEST_TRIGGER_SECRET" \
            TF_VAR_totp_encryption_key="$TOTP_ENCRYPTION_KEY" \
            TF_VAR_backend_image="$BACKEND_IMAGE" \
            TF_VAR_frontend_image="$FRONTEND_IMAGE" \
            TF_VAR_release_version="$RELEASE_VERSION" \
            timeout 1m terraform plan -input=false -out=tfplan
          '
          terraform show -json tfplan > tfplan.json
          if jq -e '.resource_changes | length == 0' tfplan.json >/dev/null; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to apply."
            exit 0
          else
            echo "Changes detected. Proceeding with apply"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Apply
        working-directory: terraform
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AT_SECRETS }}
        run: doppler run --config prd -- timeout 1m terraform apply tfplan


  # One GitHub Release per deployed commit, created only after a real apply (no-op plans don't
  # release). Notes = images now live + PRs merged since the previous release.
  release:
    needs: terraform-plan
    if: ${{ needs.terraform-plan.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_run: the commit CD built, not whatever main points at now.
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_TAG: ${{ needs.terraform-plan.outputs.release_tag }}
          BACKEND_TAG: ${{ needs.terraform-plan.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.terraform-plan.outputs.frontend_tag }}
        run: bash .github/scripts/release.sh "$RELEASE_SHA" "$RELEASE_TAG" "$BACKEND_TAG" "$FRONTEND_TAG"
